# Development environment. See README.md for commands.
# The legacy stack (docker/legacy) runs on host port 3001, so both can run at once.
# Override host ports with APP_PORT (Rails, default 3000) and VITE_PORT (Vite, default 3036).
name: eli5ience
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      HOME: /tmp
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The Vite dev server must be reachable from the browser on the same port Rails advertises.
      VITE_RUBY_HOST: 0.0.0.0
      VITE_RUBY_PORT: ${VITE_PORT:-3036}
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${VITE_PORT:-3036}:${VITE_PORT:-3036}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
  node_modules:
