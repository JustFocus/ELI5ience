name: eli5-legacy
services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_USER: eli5
      POSTGRES_PASSWORD: eli5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eli5"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ../..
      dockerfile: docker/legacy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eli5:eli5@db:5432/ELI5ience_development
    ports:
      - "${LEGACY_PORT:-3001}:3000"
